name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Carbon's packages report usage to IBM on install unless told not to
  IBM_TELEMETRY_DISABLED: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck, lint, formatting and build
      - run: npm run check
      - name: out/ matches the sources
        run: git diff --exit-code -- out
